name: Build Android APK (Release)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --force

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Assets Directory
        run: mkdir -p android/app/src/main/assets

      - name: Build React Native Bundle
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        # We use -x bundleReleaseJsAndAssets to skip the duplicate bundling since we did it manually
        run: cd android && ./gradlew assembleRelease -x bundleReleaseJsAndAssets

      - name: Upload Optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: message-app-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
